<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma Design</title>
    <link rel="stylesheet" href="./nav.css">
    <link rel="stylesheet" href="./Hero.css">
    <link rel="stylesheet" href="./content.css">
</head>
<body>
    <nav class="navbar">
        <div class="up-nav">
            <div><span>📞</span> +92 343 4282970 </div>
            <div><img src="./images/logo.png" alt="logo pic"></div>
            <div class="social-icons">
                <a >fb</a>
                <a >ig</a>
                <a >tw</a>
                <a >yt</a>
            </div>
        </div>
        <div class="sec-nav">
            <div class="nav-btns">
            <button >Home</button>
            <button >About</button>
            <button >FAQ</button>
            <button >Blog</button>
        </div>
        <div class="icons">
            <a>❤️</a>
            <a>🛒</a>
            <a>🚹</a>
        </div>
        </div>
    </nav>

    <!-- Hero section  -->
    <section class="Hero-section">
        <div class="Hero">
            <div class="hero-left">
                
                    <h2>Home > Shop</h2>
                    <h1>Shop</h1>
                
            </div>
            <div class="hero-right">
                <img src="./images/Hero-img.png">
            </div>
        </div>
    </section>

    <!-- content section -->
    <section class="Content">
        <div class="left-sidebar">
            <div class="price">
                <div><tag>Price</tag></div>
                <input type="range" min="0" max="20" step="1" value="5" style="width:full;">
                <div class="range">
                    <p>Range</p><span>$5-$20</span>
                </div>

            </div>
            <div class="Color">
                <span>Colors</span>
                <div class="color-btns">
                    <button></button>
                    <button></button>
                    <button></button>
                    <button></button>
                    <button></button>
                    <button></button>
                    <button></button>
                    <button></button>
                </div>
            </div>
            <div class="categories">

            </div>

        </div>
        <div class="right-content">

        </div>

    </section>
</body>
</html>
